<section class="soft-bg pt-4 pb-3">
    <div class="container">
        <div class="admin-band d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <div class="small fw-semibold" style="color:#ffd471; letter-spacing:.14em; text-transform:uppercase;">
                    <i class="bi bi-speedometer2 me-1"></i>Oweru admin
                </div>
                <h1 class="fw-bold text-white mb-1">{{ title }}</h1>
                {% if subtitle %}<p class="text-white-50 mb-0 small">{{ subtitle }}</p>{% endif %}
            </div>
            <div class="d-flex gap-2" style="position:relative; z-index:2;">
                <button type="button" class="btn btn-sm btn-outline-light position-relative" id="adminBellBtn"
                        data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
                    <i class="bi bi-bell me-1"></i>Alerts
                    <span id="adminBellBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill d-none"
                          style="background:#e4572e;color:#fff;font-size:.62rem;padding:.3em .55em;"></span>
                </button>
                <div class="dropdown-menu dropdown-menu-end p-0 shadow border-0" style="min-width:340px;">
                    <div id="adminBellDropdown" class="p-0"></div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#adminPanel" aria-controls="adminPanel">
                    <i class="bi bi-grid me-1"></i>Control Center
                </button>
                <a class="btn btn-sm btn-light" href="{% url 'core:staff_logout' %}">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign out
                </a>
            </div>
        </div>
    </div>
</section>
