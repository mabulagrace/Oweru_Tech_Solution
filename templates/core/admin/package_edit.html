{% extends 'base.html' %}

{% block title %}Edit Package - Oweru Admin{% endblock %}

{% block content %}
<section class="bg-light py-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1 class="fw-bold mb-0">Edit Package</h1>
            <p class="text-muted mb-0">{{ package.name }}</p>
        </div>
        <a href="{% url 'core:admin_packages' %}" class="btn btn-outline-secondary">Back to Packages</a>
    </div>
</section>

<section class="py-4">
    <div class="container">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Name</label>
                            <input name="name" value="{{ package.name }}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Group</label>
                            <select name="group" class="form-select">
                                {% for code, label in package.GROUP_CHOICES %}
                                <option value="{{ code }}" {% if package.group == code %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Sort order</label>
                            <input name="sort_order" type="number" value="{{ package.sort_order }}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Price min (TZS)</label>
                            <input name="price_tzs_min" value="{{ package.price_tzs_min }}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Price max (TZS)</label>
                            <input name="price_tzs_max" value="{{ package.price_tzs_max }}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Timeline</label>
                            <input name="timeline" value="{{ package.timeline }}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea name="description" rows="4" class="form-control">{{ package.description }}</textarea>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary">Save Package</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
