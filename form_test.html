<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FORM TEST - OWERU</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px;">
  <h2 style="color:#C87828; margin-bottom:4px;">Request Starter Website</h2>
  <p style="color:#666; margin-top:0;">Fill in your details below. We review every request and respond within one working day.</p>

  <hr style="border:none; border-top:2px solid #C87828;">

  <h3>1. Provide your details</h3>
  <form>
    <label><strong>Full name *</strong><br><input type="text" style="width:100%; padding:8px; margin-top:4px;" placeholder="Your full name"></label>
    <br><br>
    <label><strong>Email address *</strong><br><input type="email" style="width:100%; padding:8px; margin-top:4px;" placeholder="you@business.com"></label>
    <br><br>
    <label><strong>Phone number *</strong><br><input type="text" style="width:100%; padding:8px; margin-top:4px;" placeholder="+255 7XX XXX XXX"></label>
    <br><br>
    <label><strong>Address</strong><br><input type="text" style="width:100%; padding:8px; margin-top:4px;" placeholder="Street, city"></label>

    <h3 style="margin-top:30px;">2. Specify your problem</h3>
    <label><strong>Describe your problem / what you need *</strong><br>
      <textarea rows="4" style="width:100%; padding:8px; margin-top:4px;" placeholder="Tell us what you need..."></textarea>
    </label>

    <br><br>
    <button type="submit" style="background:#C87828; color:#fff; border:none; padding:14px 40px; font-size:16px; border-radius:4px;">
      Submit Request
    </button>
  </form>
</body>
</html>
